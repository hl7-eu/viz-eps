<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EPS Viewer v0.1.0</title>
    <script src="https://cdn.jsdelivr.net/npm/liquidjs@10.30.0/dist/liquid.browser.min.js" integrity="sha384-vrzmnumdkYmH7GkIg7gUc9YvUt+/8DxrEGSO7g1wK66qw4GXOp4Xv34cS3vf3hwo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/styles.css">
  </head>
  <body>

    <div class="container py-3">
      <section id="input" aria-labelledby="input-title">
        <h2 id="input-title" class="visually-hidden">Load a Bundle</h2>
        <div id="dropzone" class="ps-dropzone mb-2">
          <label for="paste" class="form-label">Paste a FHIR document Bundle (JSON or XML)</label>
          <textarea id="paste" class="form-control font-monospace" rows="4" spellcheck="false"></textarea>
          <p class="form-text mb-0">Or drop a .json or .xml file here. The Bundle stays in your browser.</p>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
          <button id="show" type="button" class="btn btn-primary">Show document</button>
          <label class="btn btn-outline-secondary mb-0" for="file">Open file</label>
          <input id="file" type="file" accept=".json,.xml,application/json,application/fhir+json,application/xml,application/fhir+xml,text/xml" class="visually-hidden">
        </div>
      </section>

      <div id="status" role="status" aria-live="polite"></div>
    </div>

    <div id="result" class="container"></div>
    <p id="preamble" class="text-muted small mt-2">EPS Viewer v0.1.0</p>

    <script src="./assets/js/fhir-xml.js"></script>
    <script src="./assets/js/eps-viewer.js"></script>
  </body>
</html>
